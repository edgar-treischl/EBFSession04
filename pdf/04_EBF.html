# 1. Schichtspezifische Sozialisationsforschung
## Zirkelhypothese

&lt;img src="media/Schuhmacher.jpg" style="width: 50%"  /&gt;
&lt;p style="font-size:50%;"&gt;Abbildung: BPB&lt;/p&gt; 



---
class: middle, center


## Die Zirkelhypothese



&lt;p style="font-size:120%;"&gt;Es folgt ein kurzer Auszug aus der Literatur:“Die Sozialisation durch den Beruf prägt in der Regel bei Mitgliedern der sozialen Unterschicht andere Züge des Sozialcharakters als bei Mitgliedern der Mittel- und Oberschicht; während der Sozialisation durch die Familie werden normalerweise die jeweils typischen Charakterzüge der Eltern an die Kinder weitervermittelt (...) (Rolff 1997: 34)” &lt;/p&gt; 



&lt;p style="font-size:120%;"&gt;“Da die Sozialisation durch die Schule auf die Ausprägungen des Sozialcharakters der Mittel- und Oberschicht besser eingestellt ist als auf die der Unterschicht, haben es die Kinder aus der Unterschicht besonders schwer, einen guten Schulerfolg zu erreichen. (Rolff 1997: 34)”&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt;“Sie erlangen häufig nur Qualifikationen für die gleichen niederen Berufspositionen, die ihre Eltern bereits ausüben. Wenn sie in diese Berufspositionen eintreten, dann ist der Zirkel geschlossen. (Rolff 1997: 34)”&lt;/p&gt; 


---


## Kritik

1. Gibt es heute noch (nur?) die drei Klassen?

2. Intergenerationale „Vererbung“ von Bildungschancen ist nicht deterministisch

3. Determinismus (Wenn X, dann Y) vs. Probabilismus (Wenn X, dann Y in 30% der Fälle)

4. Verdienst: Etablierung von "Bildungsungleichheit“ als Explanandum


&gt; Plus: Bildungsentscheidungen sind häufig Abwägungsprozesse, wir müssen die Entscheidungen erklären können.




---
class: middle, center


# 2. Humankapitaltheorie
## U.a. Gary Becker

&lt;img src="media/becker.png" style="width: 40%"  /&gt;



---


## Annahmen der HKT

- Produktivität ist eine Funktion individueller Wissensbestände

- Dies begründet den kausalen Zusammenhang zwischen formaler Bildung &amp; Einkommen, d.h. je mehr Personen in Bildung investieren, desto höher ist die Produktivität und die Bildungsrendite der Akteure.

- Investition in Humankapital: Personen vergleichen das gesamte Lebenseinkommen mit dem Lebenseinkommen, das resultiert, wenn auf die nächste Bildungsstufe verzichtet wird.

- Wenn das zusätzliche Einkommen durch eine Bildungsinvestition das alternative Lebenseinkommen ohne Bildungsinvestition übersteigt, dann investieren Menschen in ihr Humankapital.


&gt; HKT basiert auf dem Menschenbild des Homo Oeconomicus


---
class: middle, center


## Homo Oeconomicus



&lt;p style="font-size:120%;"&gt; Menschen sind ihren Handlungsmöglichkeiten beschränkt (z.B. begrenztes Einkommen) und müssen deshalb Entscheidungen treffen. Das Menschenbild des Homo Oeconomicus nimmt an, dass Menschen vorallem gemäß wirtschaftlicher Kriterien vorgehen, d.h. der Homo Oeconomicus maximiert den eigenen Nutzen oder minimiert Kosten um zu entscheiden.&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt;Die Urfassung des Homo Oeconomicus nimmt an, dass ein Individuum über die Handlungsmöglichkeiten und damit einhergehenden Konsequenzen vollständig informiert ist.&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt;Neuere Theorien basieren nicht auf dem „strengen“ Menschenbild des allwissenden Akteurs, sondern erkennen an, dass menschliche Handlungen durch zahlrreiche Restriktionen (bspw. gesellschaftliche Normen) geprägt ist und dass Menschen nicht vollständig informiert sind.&lt;/p&gt; 



---


## Missverständnisse bezüglich des Homo Oeconomicus 

- Menschenbild ist unrealistisch!

- Menschen handeln nicht (nicht nur) rational

- Bildung stellt einen (höheren) Wert an sich dar, was dass Menschenbild des Homo Oeconomicus ignoriert



---
class: middle, center


# 3. Schichtspezifische Herkunftseffekte
## Raymond Boundon: 

&lt;img src="media/boudonP.png" style="width: 30%"  /&gt;




---

## Primäre und sekundäre Herkunftseffekte



&lt;p style="font-size:125%;"&gt;Bei Boudon steht die Bildungsentscheidung im Zentrum. Es ist das Resultat einer Abwägung von Kosten und Nutzen. Die Bildungsentscheidung ist beeinflusst durch zwei Effekte der Schichtzugehörigkeit.&lt;/p&gt; 

### Primärer Herkunftseffekt:

- Es gibt schichtspezifische Unterschiede im kulturellen Hintergrund und diese wirken sich auf schulische Leistungen aus. 

- Kinder unterscheiden sich bereits vor Beginn der Schulkarriere hinsichtlich der Schulleistung.





---

### Sekundärer Herkunftseffekt



- Je nach Position im Statussystem unterscheiden sich Eltern hinsichtlich der Einschätzung von Kosten und Nutzen von Bildung

- Beispiel: Wissen über Bildungssysteme ist ungleich verteilt

- Auch bei faktisch gleicher Leistung hat die soziale Herkunft einen Einfluss auf den Entscheidungsprozess an den einzelnen Bildungsübergängen (sekundärer Effekt)





---


### Herkunftseffekte empirisch betrachtet

&lt;img src="media/boudon.png" style="width: 100%"  /&gt;








---
class: middle, center


&lt;p style="font-size:125%;"&gt;Bildungsungleihheit ist dabei das Resultat eines rationalen, aber selektiven Abwägungsprozesses.&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt;D.h. das beispielsweise Eltern mit hoher/niedriger sozialer Herkunft sich hinsichtlich der Kosten/Nutzen Abwägung unterscheiden: Aufgrund des primären Effekts haben Kinder aus niedrigen sozialen Schichten eine geringere schulische Erfolgswahrscheinlichkeit.&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt;Darüber hinaus besteht für Eltern aus einer hohen sozialen Schicht die Gefahr des Statusverlust, wenn das eigene Kind einen niedrigeren Bildungsabschluss erlangt als sie selbst.&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt;Der rationale Abwägungsprozess erklärt, warum nicht alle Menschen gleichermaßen in Bildung investieren. Dies korrespondiert mit dem Rationalitätsprinzip von Karl Popper.&lt;/p&gt; 



---
class: middle, center

## Das Rationalitätsprinzip
### Exkurs Karl Raimund Popper: Prinzip des situationsgerechten Handelns

&lt;p style="font-size:120%;"&gt;“Das ‘Rationalitätsprinzip’ […] hat nichts mit der Annahme zu tun, daß [sic] die Menschen in dem Sinne rational sind – daß sie immer eine rationale Haltung einnehmen. [...]”&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt;“Vielmehr ist es ein Minimalprinzip (...); es belebt alle, oder fast alle unsere erklärenden Situationsmodelle, und obwohl wir wissen, daß es nicht wahr ist, gibt es Gründe, es als eine gute Annäherung zu betrachten. [...]”&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt;“Wenn wir es anwenden, reduzieren wir die Willkürlichkeit unserer Modelle beträchtlich, eine Willkürlichkeit, die wirklich kapriziös wird, wenn wir versuchen, ohne dieses Prinzip zu verfahren“ (Popper 1967: 359)”&lt;/p&gt; 



---
class: middle, center

##  Obacht
### Persönliche Meinung von Edgar

&lt;p style="font-size:120%;"&gt;“Das Prinzip des situationsgerechten Handelns bedeutet nicht, dass Menschen stets Vernunftwesen sind.”&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt;“Sondern meint, dass Menschen zu rational-intentionalen Entscheidungen fähig sind, die nicht willkürlich getroffen werden.”&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt;“Ferner ist aber auch der (gesellschaftliche) Kontext zu berücksichtigten.” 😉&lt;/p&gt; 




---
class: middle, center

##  Homo Sociologicus
### 

&lt;p style="font-size:120%;"&gt;Der Homo Sociologicus handelt nach gesellschaftlichen Vorgaben - sprich Normen und Werte - die er (sie) im Sozialisationsprozess erlernt hat und die durch soziale Kontrolle und Sanktionen durchgesetzt werden.&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt;Der Soziologe Emile Durkheim würde sagen, dass Normkonformität die leitende Handlungsmaxime des Menschen ist.&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt;Was denkst du? Ist Normkonformität tatsächlich die leitende Handlungsmaxime des Menschen? Handeln Menschen nur nach gesellschaftlichen Vorgaben?&lt;/p&gt; 



---

##  Verschiede Menschenbilder

- Homo Oeconomicus, Homo Sociologicus, oder doch Homo Ludens (Der spielerische Mensch)?

- Bei Menschenbilder handelt es sich stets um ideal-typische Vereinfachungen des Menschen (heuristische Fiktionen)

&gt; Soziologische Menschenbilder entsprechen also auch nicht immer der Realität! Ist aber nicht schlimm, weil ... 



---
class: middle, center


&lt;p style="font-size:120%;"&gt;Bildungsforschung sucht nach allgemeinen Erklärungen. Nicht der Einzelfall sondern das durchschnittliche Handeln von Menschen auf der Aggregatsebene ist zu erklären. Deshalb sprach Lambert Adolphe Jacques Quetelet (1796 - 1874) auch davon, dass die Sozialwissenschaften den „homme moyen“ – den „mittleren Menschen“ untersuchen. &lt;/p&gt; 



---
class: middle, center

# 4.  Moderne Rational Choice Theorien der EBF


&lt;p style="font-size:120%;"&gt;Moderne Rational Choice Varianten basieren auf diesem Rationalitätsbegriff und sind stark von Becker/Boudon beeinflusst.&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt; D.h. beispielsweise wird Ungleichheit in der Bildungsbeteiligung über die Unterschiede in den antizipierten Kosten und Nutzen der Akteure erklärt.&lt;/p&gt; 

&lt;p style="font-size:120%;"&gt;Dies heißt nicht, das sich Menschen stets rational verhalten. Sondern...&lt;/p&gt; 



---

##  Moderne Rational Choice Theorien der EBF

1. Der angestrebte Bildungsabschluss wird in Relation zur sozialen Herkunft interpretiert („soziale Distanz“ führt zu Unterschieden in den Bildungsaspirationen).

2. Es gibt Unterschiede in den bewerteten Bildungserträgen (z.B. Statusverlustes).

3. Es gibt Unterschiede in den Opportunitätskosten (z.B. entgangenes Einkommen beim Studium).

4. Dadurch entstehen Ungleichheiten bei Bildungsentscheidungen.



---
# 5.  Die Grenzen von Rationalität

1. Menschliche Wahrnehmung ist selektiv und kann verzerrt sein.

2. Menschen setzen einfache Faustregeln (Heuristiken) ein, um Entscheidungen zu treffen.

## Heuristiken

- **Verfügbarkeitsheuristik**: Zugänglichkeit von Wissen, selektive Berücksichtigung von Informationen
    
- **Repräsentativitätsheuristik**: „Repräsentative Einzelfälle vs. Statistik“

- **Anker-Heuristik**: Orientierung an Zahlen und Werten

- **Framing-Effekt**: Überlebenschance vs. Sterblichkeitschance






---

##  Herbert A. Simon: Bounded Rationality


- Simon hat für seine Arbeit zum Thema Entscheidungsverhalten (1978) einen Nobelpreis erhalten.
    
- Laut Simon verfügen Menschen über eine begrenzte Rationalität („bounded rationality“) bspw. aufgrund begrenzter, kognitiver Verarbeitungsmöglichkeiten.

- Menschen entscheiden sich nach dem Prinzip des „satisficing“ anstelle den Nutzen zu maximieren.






---

# 6. Zusammenfassung

### - Bildungsentscheidungen als rationale Abwägung

### - Homo Oeconomicus vs. Homo Sociologicus

### - Prinzip des situationsgerechten Handelns

### - Menschen handeln für den Außenstehenden aber nicht immer rational! Stichwort: Heuristiken, Grenzen der Rationalität, Klo-Papier!
